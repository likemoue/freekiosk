server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Behind two proxies, the port this container listens on means nothing to a browser
    absolute_redirect off;

    # Docker may give the API a new address when only that container is recreated
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kiosk_api http://api:3000;

    # A heartbeat carries the whole configuration of a tablet; uploads come in parts of 20 MB
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # What Nginx Proxy Manager and Cloudflare put in front is passed on as it is
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

    location = /healthz {
        access_log off;
        proxy_pass $kiosk_api;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # A regex on purpose: a prefix ending in "/" would make nginx answer POST /api/admin/uploads
    # with a redirect, which a browser follows as a GET
    location ~ ^/api/admin/uploads/[^/]+/part$ {
        proxy_pass $kiosk_api;
        # Passed through as it arrives, instead of landing on this container's disk first
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/ {
        # Device tokens and enrollment codes travel in these requests: not for the access log
        access_log off;
        proxy_pass $kiosk_api;
        proxy_read_timeout 60s;
    }

    # Large files for the tablets. No buffering: a video can be far bigger than the temp space here
    location ~ ^/(media|dpc-apk-download)(/|$) {
        access_log off;
        proxy_pass $kiosk_api;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Shown inside the player of the app, so it must not carry the frame ban of the rest of the site
    location ^~ /player/ {
        proxy_pass $kiosk_api;
    }

    location ^~ /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        # Inline styles for computed widths; images and videos of a playlist may live on any site
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; media-src 'self' http: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
