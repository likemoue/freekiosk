# Weekly dependency updates. Version updates wait 7 days after a release (cooldown);
# security updates open a PR right away. Dependabot PRs wait for the owner to merge.
# Commit subjects follow the fork's history: build(deps): …, build(deps-dev): …, ci(deps): …
#
# Not covered on purpose:
# - gradle (android/): the React Native Gradle plugin and native modules come from
#   node_modules, so Android versions follow the npm packages, not Gradle updates.
# - bundler (Gemfile): CocoaPods for iOS builds only; this fork builds Android only.
#   Security alerts still cover both.
version: 2

updates:
  # The tablet app (React Native) and its build tools.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Asia/Ho_Chi_Minh }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    commit-message: { prefix: build, include: scope }
    groups:
      app-minor-patch:
        update-types: [minor, patch]

  # The manager website (npm workspaces apps/api and apps/web, one lockfile in cloud/).
  - package-ecosystem: npm
    directory: /cloud
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Asia/Ho_Chi_Minh }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    commit-message: { prefix: build, include: scope }
    groups:
      cloud-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Asia/Ho_Chi_Minh }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci, include: scope }

  # Base images of cloud/deploy/Dockerfile. A new Node major (engines ">=24 <25") is a task of its own.
  - package-ecosystem: docker
    directory: /cloud/deploy
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Asia/Ho_Chi_Minh }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  # postgres in cloud/compose.yaml. No major bumps: the data volume needs pg_upgrade or a dump and reload.
  - package-ecosystem: docker-compose
    directory: /cloud
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Asia/Ho_Chi_Minh }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
